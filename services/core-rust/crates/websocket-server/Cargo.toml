[package]
name = "websocket-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
tracing-subscriber = "0.3"
thiserror="2"

ws-broadcaster = { path = "../ws-broadcaster" }
surveillance-domain = { path = "../surveillance-domain" }