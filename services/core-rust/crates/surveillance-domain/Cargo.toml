[package]
name = "surveillance-domain"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Core surveillance domain models for Ideal ATC"

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"